server {
    listen 80;
    server_name shopeasyplus.duckdns.org 152.67.182.175 localhost;

    # Auto-redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://shopeasyplus.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name shopeasyplus.duckdns.org 152.67.182.175 localhost;

    ssl_certificate /etc/letsencrypt/live/shopeasyplus.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shopeasyplus.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve React Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API requests to Backend container
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy SignalR WebSockets connections with upgrade headers
    location /hubs/ {
        proxy_pass http://backend:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
